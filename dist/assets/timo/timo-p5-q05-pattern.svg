<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Pattern for groups one to four</title>
  <desc id="desc">Cross-shaped groups made from alternating circled-cross and arrow symbols.</desc>
  <rect width="960" height="300" rx="24" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="100" y="125">⊗</text>

    <text x="310" y="75">⊗</text><text x="260" y="125">⊗</text><text x="310" y="125">→</text><text x="360" y="125">⊗</text><text x="310" y="175">⊗</text>

    <text x="540" y="25">⊗</text><text x="540" y="75">→</text><text x="440" y="125">⊗</text><text x="490" y="125">→</text><text x="540" y="125">⊗</text><text x="590" y="125">→</text><text x="640" y="125">⊗</text><text x="540" y="175">→</text><text x="540" y="225">⊗</text>

    <text x="790" y="15">⊗</text><text x="790" y="50">→</text><text x="790" y="85">⊗</text>
    <text x="685" y="125">⊗</text><text x="720" y="125">→</text><text x="755" y="125">⊗</text><text x="790" y="125">→</text><text x="825" y="125">⊗</text><text x="860" y="125">→</text><text x="895" y="125">⊗</text>
    <text x="790" y="165">⊗</text><text x="790" y="200">→</text><text x="790" y="235">⊗</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#334155">
    <text x="100" y="278">1st Group</text><text x="310" y="278">2nd Group</text><text x="540" y="278">3rd Group</text><text x="790" y="278">4th Group</text>
  </g>
</svg>
